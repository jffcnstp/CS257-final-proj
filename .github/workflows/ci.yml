name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Week 2 extends CI with a PostgreSQL service so DB-backed tests run for
    # real. The measurement protocol requires the pg_stat_statements extension,
    # which must be loaded via `shared_preload_libraries` at server start.
    #
    # GitHub Actions service containers cannot override the image's command, so
    # we start Postgres manually in a step below with the required `-c` flag and
    # autovacuum disabled (the measured-window background-activity control),
    # rather than using a `services:` block.

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGMAINTENANCE_DB: postgres
      INDEX_ADVISOR_DB: index_advisor_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Start PostgreSQL with pg_stat_statements preloaded
        run: |
          docker run -d --name pg-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:16 \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=all \
            -c autovacuum=off
          # Wait for the server to accept connections.
          for i in $(seq 1 30); do
            if docker exec pg-ci pg_isready -U postgres; then
              echo "postgres is ready"; break
            fi
            echo "waiting for postgres ($i)..."; sleep 2
          done

      - name: Test (pytest)
        # DB-backed tests (-m db) now run for real against the service above;
        # the Task-4 end-to-end replay integration test runs on a miniature DB.
        run: pytest -v
