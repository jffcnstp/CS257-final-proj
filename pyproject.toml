[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "index-advisor"
version = "0.1.0"
description = "Evaluating Jev-like typed decision models (Laya) for adaptive PostgreSQL index lifecycle management."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jeff Huang" },
    { name = "John Yun" },
]
dependencies = [
    "psycopg[binary]==3.2.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "xgboost==2.1.1",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
# Laya is only needed from Week 5 (evaluate / fine-tune). Kept optional so the
# Week 1-3 pipeline installs and runs without the model dependency.
laya = ["laya==0.1.0"]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: tests that require a live PostgreSQL instance (skipped when unavailable)",
]
