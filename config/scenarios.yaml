# Scenario-generator configuration (src/advisor/scenarios.py).
#
# The generator enumerates the cartesian product of the varied factors below.
# Scenario count = base_mixes x (mix_variants + 1) x start_states x scales
#                  x seeds_per_combo.
# Dataset rows   = scenario_count x number_of_candidates (6 candidates today).
#
# Default sizing:
#   2 base mixes x (3 + 1) variants x 2 start-states x 2 scales x 2 seeds = 64
#   64 scenarios x 6 candidates = 384 labeled decisions  (>= the ~hundreds a
#   fine-tune needs). At scales 0.1/0.3 each scenario reseeds a mid-size DB and
#   replays it, so a full run takes a while — large enough for indexes to matter,
#   small enough to finish on a laptop.
#
# Determinism: a fixed master_seed makes the whole scenario set regenerate
# identically. Per-scenario data seeds are derived from master_seed + factors.

master_seed: 257

# Base workload mixes (must exist in config/workload.yaml).
base_mixes: [baseline, shifted]

# Number of JITTERED mix variants per base mix (variant 0 is the unperturbed
# mix, so the effective number of mix settings is mix_variants + 1).
mix_variants: 3

# Starting index state. BOTH are required so KEEP/DROP labels are reachable,
# not only CREATE/NO-OP.
start_states: [absent, present]

# Miniaturized DB scale factors. These must be large enough that a useful index
# produces a MEASURABLE read benefit — at very small scales (<=0.01) a seq scan
# over the tiny tables is already free, so every index looks like pure cost and
# the labeler degenerates to "never index" (no CREATE/KEEP labels). The cost
# normalization bounds (config/cost_score.yaml) MUST be calibrated at these same
# scales (scripts/calibrate_bounds.py) so real read differences are not clamped.
scales: [0.1, 0.3]

# Distinct data seeds per factor combination (varies selectivity / cardinality).
seeds_per_combo: 2

# Max fractional perturbation applied to each template weight in a jittered
# variant (e.g. 0.30 == up to +/-30%).
jitter: 0.30
