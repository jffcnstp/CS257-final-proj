# Evaluation cost score (lower is better).
#
#   score = w_r * norm(read_runtime)
#         + w_w * norm(write_overhead)
#         + w_s * norm(index_storage_bytes)
#         + w_b * norm(index_build_time)
#
#   norm(x) = (x - min) / (max - min)   clamped to [0, 1]
#
# Weights are a TUNABLE decision and sum to 1.0. Every component is also
# reported raw (see src/advisor/cost.py) so trade-offs are never hidden.
#
# NOTE: `bounds` below were produced by scripts/calibrate_bounds.py from a
# measured sample of labeling runs (Week-3 calibration), replacing the
# Week-1 placeholders. Units: read_runtime / write_overhead / index_build_time
# in seconds; index_storage_bytes in bytes.

weights:
  w_r: 0.5
  w_w: 0.3
  w_s: 0.1
  w_b: 0.1
bounds:
  read_runtime:
    min: 0.101638
    max: 1.535625
  write_overhead:
    min: 0.00127
    max: 0.01127
  index_storage_bytes:
    min: 0.0
    max: 14868480.0
  index_build_time:
    min: 0.0
    max: 0.631352
